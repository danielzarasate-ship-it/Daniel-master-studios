name: Build Daniel Master Studio APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v             -keystore "$RUNNER_TEMP/daniel-master-studio-release.jks"             -storepass "temporary-build-password"             -keypass "temporary-build-password"             -alias daniel-master-studio             -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Daniel Master Studio, OU=Personal, O=Daniel, L=San Luis Potosi, ST=SLP, C=MX"

      - name: Align and sign APK
        run: |
          set -e
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/Daniel-Master-Studio-aligned.apk"
          FINAL="app/build/outputs/apk/release/Daniel-Master-Studio.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/daniel-master-studio-release.jks"             --ks-pass pass:temporary-build-password             --key-pass pass:temporary-build-password             --out "$FINAL" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$FINAL"
          ls -lh "$FINAL"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Daniel-Master-Studio-release-apk
          path: app/build/outputs/apk/release/Daniel-Master-Studio.apk
          if-no-files-found: error
          retention-days: 30
